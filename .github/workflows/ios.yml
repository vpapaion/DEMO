name: Build MotoSpeed iOS

on:
  push:
    branches: [gps-speed-ios]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned device app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project MotoSpeed.xcodeproj \
            -scheme MotoSpeed \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build | tee xcodebuild.log

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/MotoSpeed.app dist/Payload/
          cd dist
          zip -qry MotoSpeed-iOS-unsigned.ipa Payload
          rm -rf Payload
          shasum -a 256 MotoSpeed-iOS-unsigned.ipa > SHA256SUMS.txt
          cp ../README.md INSTALL.md

      - name: Upload iPhone package
        uses: actions/upload-artifact@v4
        with:
          name: MotoSpeed-iOS-v1.0.0-unsigned
          path: |
            ios/dist/MotoSpeed-iOS-unsigned.ipa
            ios/dist/INSTALL.md
            ios/dist/SHA256SUMS.txt
          if-no-files-found: error
